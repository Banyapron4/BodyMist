<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>รายการคำสั่งซื้อ — Body Scent</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Page-specific table styles */
    .table-wrap {
      overflow-x: auto;
      background-color: var(--color-white);
      border: 1px solid var(--color-line);
    }

    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: 0.92rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: 1rem 1.1rem;
      text-align: left;
      vertical-align: top;
      border-bottom: 1px solid var(--color-line);
    }

    #ordersTable thead th {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--color-ink-soft);
      background-color: var(--color-sand);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background-color: var(--color-cream);
    }

    #ordersTable td:first-child {
      white-space: nowrap;
    }

    #ordersTable td:nth-child(5) {
      white-space: nowrap;
      font-family: var(--font-serif);
      color: var(--color-accent-dark);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Body Scent</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">Admin</span>
          <h1>รายการคำสั่งซื้อ</h1>
          <span class="divider"></span>
          <p class="lead" style="margin-left:auto;margin-right:auto;">แสดงรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">Body Scent</span>
      <p>&copy; 2026 Body Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
